name: Выпустить обновление Эфира
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например v2.0.0'
        required: true
        default: 'v2.0.0'
        type: string
      test_only:
        description: 'Только проверка (не публиковать)'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  check:
    uses: ./.github/workflows/build.yml
  release:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Efir-Windows-test-build
          path: assets
      - name: Проверить версию и файлы
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Используйте формат v2.0.0'; exit 1; }
          test -s assets/Efir_Setup.exe
          test -s assets/Efir-App.zip
          sha256sum assets/*
      - name: Опубликовать обновление
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" assets/Efir_Setup.exe assets/Efir-App.zip --target "$GITHUB_SHA" --title "Эфир $VERSION" --notes "Установка и обновление Эфира для Windows. Скачайте Efir_Setup.exe."

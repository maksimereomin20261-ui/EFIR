name: Проверить и собрать Эфир
on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Установить зависимости сборки
        shell: pwsh
        run: |
          python -m pip install -r installer/requirements-build.txt -r app/requirements.txt Pillow==11.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Ошибка установки зависимостей' }
      - name: Проверить код и сохранение данных
        shell: pwsh
        run: |
          python -m py_compile app/main.py installer/launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Ошибка синтаксиса' }
          python -m unittest discover -s installer -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Ошибка тестов установщика' }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Ошибка тестов приложения' }
      - name: Собрать и проверить приложение
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Efir --icon installer/Efir.ico app/main.py
          if ($LASTEXITCODE -ne 0) { throw 'Ошибка сборки приложения' }
          python tests/smoke_exe.py dist/Efir/Efir.exe
          if ($LASTEXITCODE -ne 0) { throw 'Окно приложения не открылось' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist/Efir/* -DestinationPath artifacts/Efir-App.zip
          python installer/verify_package.py artifacts/Efir-App.zip
          if ($LASTEXITCODE -ne 0) { throw 'Ошибка проверки пакета' }
          python tests/smoke_installer.py artifacts/Efir-App.zip
          if ($LASTEXITCODE -ne 0) { throw 'Ошибка проверки установки' }
      - name: Собрать установщик
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Efir_Setup --icon installer/Efir.ico --distpath setup-dist --workpath setup-build installer/launcher.py
          if ($LASTEXITCODE -ne 0 -or !(Test-Path setup-dist/Efir_Setup.exe)) { throw 'Ошибка сборки установщика' }
          Copy-Item setup-dist/Efir_Setup.exe artifacts/Efir_Setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Efir-Windows-test-build
          path: artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Efir-loader-visual-preview
          path: ui-preview/*.png
          if-no-files-found: ignore
